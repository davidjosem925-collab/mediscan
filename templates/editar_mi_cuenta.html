{% extends "base.html" %}


{% block title %}
Editar mis datos | Mediscan
{% endblock %}


{% block content %}

<section class="page-section">

    <div class="container">

        <a
            href="{{ url_for('mi_cuenta') }}"
            class="back-link"
        >
            ← Volver a mi cuenta
        </a>


        <div class="page-header">

            <span class="section-label">
                Portal del paciente
            </span>

            <h1>
                Editar mis datos
            </h1>

            <p>
                Actualizá tu información personal.
            </p>

        </div>


        {% if error %}

            <div class="booking-error">
                {{ error }}
            </div>

        {% endif %}


        <section class="admin-detail-card">

            <form
                method="POST"
                class="admin-form"
            >

                <div class="form-group">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        value="{{ paciente['nombre'] }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="apellido">
                        Apellido
                    </label>

                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        value="{{ paciente['apellido'] }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="dni">
                        DNI
                    </label>

                    <input
                        type="text"
                        id="dni"
                        name="dni"
                        value="{{ paciente['dni'] }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ paciente['email'] }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="text"
                        id="telefono"
                        name="telefono"
                        value="{{ paciente['telefono'] }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="obra_social">
                        Obra social
                    </label>

                    <input
                        type="text"
                        id="obra_social"
                        name="obra_social"
                        value="{{ paciente['obra_social'] }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="numero_afiliado">
                        Número de afiliado
                    </label>

                    <input
                        type="text"
                        id="numero_afiliado"
                        name="numero_afiliado"
                        value="{{ paciente['numero_afiliado'] or '' }}"
                    >

                </div>


                <div class="admin-form-actions">

                    <a
                        href="{{ url_for('mi_cuenta') }}"
                        class="btn-secondary"
                    >
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Guardar cambios
                    </button>

                </div>

            </form>

        </section>

    </div>

</section>

{% endblock %}
